services:
  - type: web
    name: news-pulse-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-pulse-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: PYTHON_PATH
        value: python

databases:
  - name: news-pulse-db
    databaseName: newspulse
    user: newspulse
    plan: free
